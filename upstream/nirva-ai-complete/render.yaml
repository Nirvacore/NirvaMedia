services:
  - type: web
    name: nirva-dashboard
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm build && CI=true STORYBOOK_DISABLE_TELEMETRY=1 pnpm build-storybook && mkdir -p dist/public/storybook && cp -r storybook-static/* dist/public/storybook/
    startCommand: node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOW_DEMO_AUTH
        value: "true"
      - key: DATABASE_PATH
        value: /opt/render/project/src/data/nirva.db
      - key: PORT
        value: 3000
