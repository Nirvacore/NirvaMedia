# Nginx reverse proxy for ai.nirva.one on Contabo VPS
# Install: sudo cp deploy/contabo/nginx-ai.nirva.one.conf /etc/nginx/sites-available/ai.nirva.one
#          sudo ln -sf /etc/nginx/sites-available/ai.nirva.one /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# SSL:     sudo certbot --nginx -d ai.nirva.one

upstream nirva_dashboard {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name ai.nirva.one;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ai.nirva.one;

    # Certbot fills these after: certbot --nginx -d ai.nirva.one
    ssl_certificate     /etc/letsencrypt/live/ai.nirva.one/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.nirva.one/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    # WebSocket (live updates)
    location /ws {
        proxy_pass http://nirva_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location / {
        proxy_pass http://nirva_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
